# Ödevin ilerleme durumu — panelin "Genel Bakış" sayfası bu dosyayı okur.
# durum: tamam | devam | bekliyor
# Bu dosya Claude tarafından her aşama sonunda güncellenir.

teslimler:
  - ad: "1. rapor — Sınıflandırma (CLS)"
    tarih: "2026-11-24 23:59"
  - ad: "2. rapor — Bölütleme (SEG)"
    tarih: "2026-12-08 23:59"

puanlama:
  - bilesen: "Veri hazırlama ve etiket dönüşümünün doğruluğu"
    agirlik: 20
    durum: tamam
    not: "İndirme, denetim, dönüşüm, doğrulama, sızıntı analizi ve Roboflow çapraz kontrolü tamam (Mac + Colab'da aynı sonuç)."
  - bilesen: "Sınıflandırma deneyi"
    agirlik: 20
    durum: devam
    not: "9 eğitim Colab T4'te bitti (~2 sa). Test doğruluğu (3 seed ort.): nano 0,915, small 0,904, nano-384 0,934; sonuçlar panelde. Kalan: sonuç yorumu ve rapor."
  - bilesen: "Segmentasyon karşılaştırması (YOLO-seg ve RF-DETR)"
    agirlik: 25
    durum: devam
    not: "03 notebook'u ve ortak değerlendirme kodu yazıldı, yerel duman testi geçti (12 Kas). Kararlar: ortak çözünürlük 480, RF-DETR Seg Small. Sırada Colab eğitimleri."
  - bilesen: "Hata analizi ve \"Dikkat\" maddesi"
    agirlik: 20
    durum: bekliyor
    not: "CLS karmaşıklık + yaprak/meyve/çiçek matrisi hazır (gruplar arası karışma nano %2,2). En kötü 10 tahmin seçildi; yorumları yazılacak."
  - bilesen: "Rapor ve sunum"
    agirlik: 15
    durum: bekliyor
    not: "Sonuçlar gelince taslaklar hazırlanacak."

asamalar:
  - ad: "Aşama 0 — Kurulum"
    durum: tamam
    adimlar:
      - ["Kaggle API anahtarı", tamam]
      - ["Colab T4 GPU kontrolü", tamam]
      - ["Yerel Python 3.13 ortamı", tamam]
      - ["Roboflow hesabı (private proje)", tamam]
  - ad: "Aşama 1 — Veri hazırlama"
    durum: tamam
    adimlar:
      - ["Veriyi indirme + SHA-256 doğrulama", tamam]
      - ["Keşifsel analiz (EDA)", tamam]
      - ["Etiket denetimi ve kurallı düzeltme", tamam]
      - ["Görüntü düzeyi etiket kuralı", tamam]
      - ["Yinelenen / sızıntı analizi (pHash eşiği 12)", tamam]
      - ["Sızıntı kararı: resmi bölme + temiz test (kullanıcı onayı, 11 Kas)", tamam]
      - ["Dönüşümler: CLS klasörleri, YOLO-seg, COCO", tamam]
      - ["Dönüşüm doğrulaması (geri-dönüş IoU, pycocotools)", tamam]
      - ["01 notebook'u (yerelde ve Colab'da çalıştı, sonuçlar birebir aynı)", tamam]
      - ["Roboflow çapraz kontrolü (5.571 örnek, ort. IoU 0,99995)", tamam]
  - ad: "Aşama 2 — Sınıflandırma"
    durum: devam
    adimlar:
      - ["02 notebook'u + yerel duman testi", tamam]
      - ["Colab eğitimleri (n/s × 3 seed + ablasyon; 9/9 bitti, ~2 sa)", tamam]
      - ["Panel: Sınıflandırma sayfası (gerçek sonuçlarla kontrol edildi)", tamam]
      - ["Metrikler, karmaşıklık matrisi, en kötü 10 (hesaplandı)", tamam]
      - ["Sonuç yorumu ve en kötü 10 tahminin açıklaması", bekliyor]
      - ["1. rapor", bekliyor]
  - ad: "Aşama 3 — Segmentasyon"
    durum: devam
    adimlar:
      - ["Mac mini kurulumu", tamam]
      - ["Kararlar: ortak çözünürlük 480, RF-DETR Seg Small (kullanıcı, 12 Kas)", tamam]
      - ["Ortak değerlendirme kodu + testler (mAP, mIoU, Dice, örnek karışma)", tamam]
      - ["03 notebook'u + yerel duman testi", tamam]
      - ["Colab eğitimleri (YOLO26n/s-seg, RF-DETR Seg Small × 3 seed)", bekliyor]
      - ["Test değerlendirmesi, verimlilik, en kötü 10 (Colab'da)", bekliyor]
      - ["Panel: Segmentasyon sayfası", bekliyor]
      - ["2. rapor + sunum", bekliyor]
