    agirlik: 15
    durum: devam
    not: "İki rapor taslağı hazır (4 ve 5 sayfa, iki sütun IEEE, Türkçe; 22 Kas). Kalan: kullanıcının okuması ve 10 dk'lık sunum."

asamalar:
