    tarih: "2026-12-08 23:59"

puanlama:
  - bilesen: "Veri hazırlama ve etiket dönüşümünün doğruluğu"
    agirlik: 20
    durum: tamam
    not: "İndirme, denetim, dönüşüm, doğrulama, sızıntı analizi ve Roboflow çapraz kontrolü tamam (Mac + Colab'da aynı sonuç)."
  - bilesen: "Sınıflandırma deneyi"
    agirlik: 20
    durum: devam
    not: "9 eğitim Colab T4'te bitti (~2 sa). Test doğruluğu (3 seed ort.): nano 0,915, small 0,904, nano-384 0,934; sonuç yorumu 1. rapor taslağında (22 Kas)."
  - bilesen: "Segmentasyon karşılaştırması (YOLO-seg ve RF-DETR)"
    agirlik: 25
    durum: tamam
    not: "9/9 eğitim, ortak değerlendirme ve karşılaştırma bitti (22 Kas). Test maske mAP50-95 (3 seed ort.): YOLO26n 0,600 · YOLO26s 0,623 · RF-DETR 0,691; uçtan uca 18–19 ↔ 60 ms; Wilcoxon ile RF-DETR üstünlüğü anlamlı."
  - bilesen: "Hata analizi ve \"Dikkat\" maddesi"
    agirlik: 20
    durum: tamam
    not: "Meyve/yaprak karışması: CLS %2,1–2,4, SEG %0,03–0,28. En kötü 10 tahmin hem CLS hem SEG için görselli ve hata türlerine ayrılarak yorumlandı (iki rapor taslağında)."
